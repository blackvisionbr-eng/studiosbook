<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudiosBook Brand Studio</title>
    <meta name="theme-color" content="#402239" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
    <style>
      :root {
        --plum: #402239;
        --rose: #a84d68;
        --coral: #e97f91;
        --dusty: #c77d94;
        --ivory: #fff9fa;
        --ink: #171417;
        --muted: #6f666c;
        --line: #e8e1e4;
        --surface: #ffffff;
        --focus: #2e7d72;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { overflow-x: hidden; background: #f4eff1; color: var(--ink); font-family: "DM Sans", Arial, sans-serif; }
      button, input, select, textarea { font: inherit; }

      .app { min-height: 100vh; display: grid; grid-template-columns: minmax(280px, 348px) minmax(0, 1fr); }
      .sidebar { min-width: 0; border-right: 1px solid var(--line); background: var(--surface); }
      .sidebar-inner { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 24px; }

      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
      .brand-mark { width: 42px; height: 42px; flex: 0 0 auto; }
      .brand-name { margin: 0; font-size: 20px; line-height: 1; }
      .brand-name span { color: var(--rose); font-weight: 500; }
      .brand-kicker { margin: 5px 0 0; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }

      .control-group { display: grid; gap: 9px; margin-bottom: 18px; }
      .control-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      label, legend { color: #514a4f; font-size: 12px; font-weight: 700; }
      input, select, textarea {
        width: 100%; min-width: 0; border: 1px solid #d5ccd1; border-radius: 8px; outline: none;
        background: #fff; color: var(--ink); padding: 10px 12px; transition: border-color 180ms, box-shadow 180ms;
      }
      textarea { min-height: 72px; resize: vertical; line-height: 1.4; }
      input:focus, select:focus, textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgb(46 125 114 / 0.14); }
      input[type="file"] { padding: 8px; font-size: 12px; }

      fieldset { min-width: 0; margin: 0 0 18px; padding: 0; border: 0; }
      legend { margin-bottom: 9px; }
      .swatches { display: flex; gap: 8px; }
      .swatch {
        width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50%; padding: 0; cursor: pointer;
        box-shadow: 0 0 0 1px #cfc5ca; transition: transform 180ms, box-shadow 180ms;
      }
      .swatch:hover { transform: scale(1.07); }
      .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

      .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding-top: 4px; }
      .btn {
        min-height: 44px; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer;
        font-weight: 700; transition: transform 180ms, background-color 180ms;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn-primary { background: var(--plum); color: #fff; }
      .btn-primary:hover { background: #2b1827; }
      .btn-secondary { width: 44px; padding: 0; border: 1px solid var(--line); background: #fff; color: var(--ink); font-size: 20px; }

      .workspace { min-width: 0; display: grid; grid-template-rows: auto 1fr; }
      .topbar {
        min-width: 0; min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
        border-bottom: 1px solid var(--line); background: rgb(255 255 255 / 0.92); padding: 14px 22px;
      }
      .topbar h1 { margin: 0; font-size: 18px; }
      .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }

      .stage {
        min-width: 0; display: grid; place-items: center; overflow: auto; padding: 32px;
        background-color: #eee8eb;
      }
      .canvas-shell { width: min(100%, 1080px); min-width: 0; border-radius: 8px; box-shadow: 0 24px 80px rgb(23 20 23 / 0.22); overflow: hidden; }
      canvas { display: block; width: 100%; height: auto; background: transparent; }

      .render-mode { min-width: 0; min-height: 0; overflow: hidden; background: transparent; }
      .render-mode .sidebar, .render-mode .topbar { display: none; }
      .render-mode .app { display: block; width: max-content; min-height: 0; }
      .render-mode .workspace { display: block; }
      .render-mode .stage { display: block; overflow: hidden; padding: 0; background: transparent; }
      .render-mode .canvas-shell { width: max-content; border-radius: 0; box-shadow: none; }
      .render-mode canvas { width: auto; height: auto; }

      @media (max-width: 860px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
        .sidebar-inner { position: static; max-height: none; }
        .stage { min-height: 58vh; padding: 18px; }
      }

      @media (max-width: 520px) {
        .sidebar-inner { padding: 18px 16px; }
        .control-row { grid-template-columns: 1fr; }
        .topbar { align-items: flex-start; flex-direction: column; padding: 14px 16px; }
        .meta { white-space: normal; }
        .stage { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-inner">
          <div class="brand">
            <svg class="brand-mark" viewBox="0 0 128 128" aria-hidden="true">
              <path d="M59.5 59.5C43 59.2 30.7 54.4 22.6 45.6C15.9 38.4 13.5 29.4 14.5 15C29.1 14.2 38.4 17 45.9 23.6C54.8 31.5 59.3 43.5 59.5 59.5Z" fill="#402239"/>
              <path d="M59.5 59.5C43 59.2 30.7 54.4 22.6 45.6C15.9 38.4 13.5 29.4 14.5 15C29.1 14.2 38.4 17 45.9 23.6C54.8 31.5 59.3 43.5 59.5 59.5Z" fill="#E97F91" transform="translate(128 0) scale(-1 1)"/>
              <path d="M59.5 59.5C43 59.2 30.7 54.4 22.6 45.6C15.9 38.4 13.5 29.4 14.5 15C29.1 14.2 38.4 17 45.9 23.6C54.8 31.5 59.3 43.5 59.5 59.5Z" fill="#C77D94" transform="translate(0 128) scale(1 -1)"/>
              <path d="M59.5 59.5C43 59.2 30.7 54.4 22.6 45.6C15.9 38.4 13.5 29.4 14.5 15C29.1 14.2 38.4 17 45.9 23.6C54.8 31.5 59.3 43.5 59.5 59.5Z" fill="#402239" transform="translate(128 128) scale(-1 -1)"/>
            </svg>
            <div>
              <p class="brand-name"><strong>Studios</strong><span>Book</span></p>
              <p class="brand-kicker">Brand Studio</p>
            </div>
          </div>

          <div class="control-group">
            <label for="template">Modelo</label>
            <select id="template">
              <option value="thumbnail">Capa YouTube - 16:9</option>
              <option value="intro">Abertura - 16:9</option>
              <option value="chapter">Capítulo - 16:9</option>
              <option value="outro">Encerramento - 16:9</option>
              <option value="tip">Dica rápida - 16:9</option>
              <option value="reel">Capa Reels - 9:16</option>
              <option value="lower">Lower third transparente</option>
            </select>
          </div>

          <div class="control-row">
            <div class="control-group">
              <label for="series">Série</label>
              <input id="series" maxlength="42" value="Primeiros Passos" />
            </div>
            <div class="control-group">
              <label for="episode">Episódio</label>
              <input id="episode" maxlength="12" value="01" />
            </div>
          </div>

          <div class="control-group">
            <label for="title">Título</label>
            <textarea id="title" maxlength="110">Como instalar o StudiosBook</textarea>
          </div>

          <div class="control-group">
            <label for="subtitle">Subtítulo</label>
            <textarea id="subtitle" maxlength="150">Configure o aplicativo no celular e tenha sua agenda sempre por perto.</textarea>
          </div>

          <div class="control-row">
            <div class="control-group">
              <label for="cta">Chamada</label>
              <input id="cta" maxlength="40" value="Continuar aprendendo" />
            </div>
            <div class="control-group">
              <label for="url">Endereço</label>
              <input id="url" maxlength="48" value="studiosbook.com.br" />
            </div>
          </div>

          <div class="control-row">
            <div class="control-group">
              <label for="person">Nome</label>
              <input id="person" maxlength="36" value="Newton Sobrinho" />
            </div>
            <div class="control-group">
              <label for="role">Função</label>
              <input id="role" maxlength="44" value="BlackVision" />
            </div>
          </div>

          <div class="control-group">
            <label for="screenshot">Print do aplicativo</label>
            <input id="screenshot" type="file" accept="image/png,image/jpeg,image/webp" />
          </div>

          <fieldset>
            <legend>Cor de destaque</legend>
            <div class="swatches">
              <button class="swatch" type="button" data-color="#E97F91" style="background:#E97F91" aria-label="Coral" aria-pressed="true"></button>
              <button class="swatch" type="button" data-color="#A84D68" style="background:#A84D68" aria-label="Rosa institucional" aria-pressed="false"></button>
              <button class="swatch" type="button" data-color="#2E7D72" style="background:#2E7D72" aria-label="Teal" aria-pressed="false"></button>
              <button class="swatch" type="button" data-color="#2F7A5F" style="background:#2F7A5F" aria-label="Verde" aria-pressed="false"></button>
            </div>
          </fieldset>

          <div class="actions">
            <button id="download" class="btn btn-primary" type="button">Exportar PNG</button>
            <button id="reset" class="btn btn-secondary" type="button" title="Restaurar" aria-label="Restaurar">&#8635;</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <h1 id="preview-title">Capa YouTube</h1>
          <span id="dimensions" class="meta">1280 x 720 px</span>
        </header>
        <section class="stage" aria-label="Pré-visualização">
          <div class="canvas-shell"><canvas id="canvas" width="1280" height="720"></canvas></div>
        </section>
      </main>
    </div>

    <script>
      const palette = {
        plum: "#402239", plumDark: "#2B1827", rose: "#A84D68", dusty: "#C77D94",
        coral: "#E97F91", blush: "#F7E7EB", ivory: "#FFF9FA", white: "#FFFFFF",
        ink: "#171417", muted: "#6F666C", line: "#E8E1E4", focus: "#2E7D72"
      };

      const templates = {
        thumbnail: { label: "Capa YouTube", width: 1280, height: 720 },
        intro: { label: "Abertura", width: 1920, height: 1080 },
        chapter: { label: "Capítulo", width: 1920, height: 1080 },
        outro: { label: "Encerramento", width: 1920, height: 1080 },
        tip: { label: "Dica rápida", width: 1920, height: 1080 },
        reel: { label: "Capa Reels", width: 1080, height: 1920 },
        lower: { label: "Lower third", width: 1920, height: 1080 }
      };

      const defaults = {
        template: "thumbnail", series: "Primeiros Passos", episode: "01",
        title: "Como instalar o StudiosBook",
        subtitle: "Configure o aplicativo no celular e tenha sua agenda sempre por perto.",
        cta: "Continuar aprendendo", url: "studiosbook.com.br",
        person: "Newton Sobrinho", role: "BlackVision", accent: palette.coral
      };

      const state = { ...defaults, image: null };
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const petal = new Path2D("M59.5 59.5C43 59.2 30.7 54.4 22.6 45.6C15.9 38.4 13.5 29.4 14.5 15C29.1 14.2 38.4 17 45.9 23.6C54.8 31.5 59.3 43.5 59.5 59.5Z");

      function roundedRect(context, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + width, y, x + width, y + height, r);
        context.arcTo(x + width, y + height, x, y + height, r);
        context.arcTo(x, y + height, x, y, r);
        context.arcTo(x, y, x + width, y, r);
        context.closePath();
      }

      function fillRounded(context, x, y, width, height, radius, color) {
        roundedRect(context, x, y, width, height, radius);
        context.fillStyle = color;
        context.fill();
      }

      function drawMark(context, x, y, size, reversed = false, opacity = 1) {
        const scale = size / 128;
        const colors = reversed
          ? [palette.white, state.accent, "#F3BDC7", palette.white]
          : [palette.plum, state.accent, palette.dusty, palette.plum];

        context.save();
        context.globalAlpha = opacity;
        context.translate(x, y);
        context.scale(scale, scale);

        const transforms = [
          [1, 0, 0, 1, 0, 0], [-1, 0, 0, 1, 128, 0],
          [1, 0, 0, -1, 0, 128], [-1, 0, 0, -1, 128, 128]
        ];
        transforms.forEach((matrix, index) => {
          context.save();
          context.transform(...matrix);
          context.fillStyle = colors[index];
          context.fill(petal);
          context.restore();
        });
        context.restore();
      }

      function drawWordmark(context, x, y, fontSize, reversed = false, align = "left") {
        const studios = "Studios";
        const book = "Book";
        context.save();
        context.textBaseline = "alphabetic";
        context.font = `700 ${fontSize}px "DM Sans", Arial, sans-serif`;
        const studiosWidth = context.measureText(studios).width;
        context.font = `500 ${fontSize}px "DM Sans", Arial, sans-serif`;
        const bookWidth = context.measureText(book).width;
        let start = x;
        if (align === "center") start -= (studiosWidth + bookWidth) / 2;
        context.font = `700 ${fontSize}px "DM Sans", Arial, sans-serif`;
        context.fillStyle = reversed ? palette.white : palette.ink;
        context.fillText(studios, start, y);
        context.font = `500 ${fontSize}px "DM Sans", Arial, sans-serif`;
        context.fillStyle = reversed ? "#F3BDC7" : palette.rose;
        context.fillText(book, start + studiosWidth, y);
        context.restore();
      }

      function wrapLines(context, text, maxWidth, maxLines = 4) {
        const words = String(text || "").trim().split(/\s+/).filter(Boolean);
        const lines = [];
        let line = "";
        words.forEach((word) => {
          const candidate = line ? `${line} ${word}` : word;
          if (context.measureText(candidate).width <= maxWidth || !line) {
            line = candidate;
          } else {
            lines.push(line);
            line = word;
          }
        });
        if (line) lines.push(line);
        if (lines.length > maxLines) {
          lines.length = maxLines;
          while (context.measureText(`${lines[maxLines - 1]}...`).width > maxWidth) {
            lines[maxLines - 1] = lines[maxLines - 1].split(" ").slice(0, -1).join(" ");
          }
          lines[maxLines - 1] += "...";
        }
        return lines;
      }

      function drawTextBlock(context, text, x, y, maxWidth, options = {}) {
        const size = options.size || 64;
        const lineHeight = options.lineHeight || size * 1.06;
        const weight = options.weight || 700;
        const family = options.family || '"DM Sans", Arial, sans-serif';
        context.save();
        context.font = `${weight} ${size}px ${family}`;
        context.fillStyle = options.color || palette.ink;
        context.textBaseline = "top";
        const lines = wrapLines(context, text, maxWidth, options.maxLines || 4);
        lines.forEach((line, index) => context.fillText(line, x, y + index * lineHeight));
        context.restore();
        return y + lines.length * lineHeight;
      }

      function drawEyebrow(context, text, x, y, color, size = 22) {
        context.save();
        context.font = `700 ${size}px "DM Sans", Arial, sans-serif`;
        context.fillStyle = color;
        context.textBaseline = "top";
        context.fillText(String(text || "").toUpperCase(), x, y);
        context.restore();
      }

      function drawImageCover(context, image, x, y, width, height, radius) {
        context.save();
        roundedRect(context, x, y, width, height, radius);
        context.clip();
        const sourceRatio = image.width / image.height;
        const targetRatio = width / height;
        let sw = image.width;
        let sh = image.height;
        let sx = 0;
        let sy = 0;
        if (sourceRatio > targetRatio) {
          sw = image.height * targetRatio;
          sx = (image.width - sw) / 2;
        } else {
          sh = image.width / targetRatio;
          sy = (image.height - sh) / 2;
        }
        context.drawImage(image, sx, sy, sw, sh, x, y, width, height);
        context.restore();
      }

      function drawMockApp(context, x, y, width, height, radius = 24) {
        context.save();
        context.shadowColor = "rgba(23,20,23,.16)";
        context.shadowBlur = 34;
        context.shadowOffsetY = 18;
        fillRounded(context, x, y, width, height, radius, palette.white);
        context.restore();

        context.save();
        roundedRect(context, x, y, width, height, radius);
        context.clip();
        context.fillStyle = palette.plum;
        context.fillRect(x, y, width, Math.max(66, height * 0.12));
        drawMark(context, x + 22, y + 18, Math.max(34, height * 0.065), true);

        const pad = Math.max(24, width * 0.05);
        const top = y + height * 0.18;
        context.fillStyle = palette.ink;
        context.font = `700 ${Math.max(22, width * 0.045)}px "DM Sans", Arial, sans-serif`;
        context.fillText("Visão geral", x + pad, top);

        const cardGap = Math.max(12, width * 0.025);
        const cardWidth = (width - pad * 2 - cardGap) / 2;
        const cardHeight = height * 0.18;
        [0, 1].forEach((index) => {
          const cardX = x + pad + index * (cardWidth + cardGap);
          fillRounded(context, cardX, top + 30, cardWidth, cardHeight, 14, index ? "#F7E7EB" : "#EEF6F2");
          context.fillStyle = index ? palette.rose : "#2F7A5F";
          context.fillRect(cardX + 18, top + 48, 8, cardHeight - 36);
        });

        const listTop = top + cardHeight + 62;
        context.font = `700 ${Math.max(18, width * 0.032)}px "DM Sans", Arial, sans-serif`;
        context.fillStyle = palette.ink;
        context.fillText("Próximos atendimentos", x + pad, listTop);
        for (let index = 0; index < 4; index += 1) {
          const rowY = listTop + 24 + index * Math.max(58, height * 0.095);
          fillRounded(context, x + pad, rowY, width - pad * 2, Math.max(46, height * 0.07), 10, "#F4EFF1");
          context.fillStyle = index === 0 ? state.accent : palette.dusty;
          context.beginPath();
          context.arc(x + pad + 24, rowY + Math.max(23, height * 0.035), 8, 0, Math.PI * 2);
          context.fill();
        }
        context.restore();
      }

      function drawScreenshot(context, x, y, width, height, radius = 26) {
        if (state.image) {
          context.save();
          context.shadowColor = "rgba(23,20,23,.2)";
          context.shadowBlur = 42;
          context.shadowOffsetY = 18;
          drawImageCover(context, state.image, x, y, width, height, radius);
          context.restore();
        } else {
          drawMockApp(context, x, y, width, height, radius);
        }
      }

      function drawThumbnail() {
        ctx.fillStyle = palette.ivory;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = palette.plum;
        ctx.fillRect(0, 0, 28, canvas.height);
        drawMark(ctx, 72, 55, 62);
        drawWordmark(ctx, 150, 103, 36);

        drawEyebrow(ctx, `${state.series}  |  ${state.episode}`, 72, 184, palette.rose, 20);
        const endY = drawTextBlock(ctx, state.title, 72, 224, 535, { size: 68, lineHeight: 72, maxLines: 4 });
        drawTextBlock(ctx, state.subtitle, 72, endY + 24, 510, { size: 25, lineHeight: 34, weight: 500, color: palette.muted, maxLines: 3 });

        fillRounded(ctx, 72, 624, 270, 48, 24, state.accent);
        ctx.fillStyle = palette.white;
        ctx.font = '700 19px "DM Sans", Arial, sans-serif';
        ctx.textBaseline = "middle";
        ctx.fillText("TUTORIAL STUDIOSBOOK", 98, 648);

        drawScreenshot(ctx, 685, 108, 505, 520, 28);
      }

      function drawIntro() {
        ctx.fillStyle = palette.plum;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawMark(ctx, 810, 246, 300, true);
        drawWordmark(ctx, 960, 700, 116, true, "center");
        ctx.fillStyle = "#F3BDC7";
        ctx.fillRect(782, 754, 356, 5);
        ctx.fillStyle = palette.white;
        ctx.font = '500 42px "DM Sans", Arial, sans-serif';
        ctx.textAlign = "center";
        ctx.fillText("Seu talento em foco. Seu studio sob controle.", 960, 838);
        ctx.font = '700 22px "DM Sans", Arial, sans-serif';
        ctx.fillStyle = state.accent;
        ctx.fillText(`${state.series.toUpperCase()}  |  ${state.episode}`, 960, 928);
        ctx.textAlign = "left";
      }

      function drawChapter() {
        ctx.fillStyle = palette.ivory;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = palette.plum;
        ctx.fillRect(0, 0, 94, canvas.height);
        drawMark(ctx, 1450, 110, 520, false, 0.12);
        drawMark(ctx, 150, 100, 88);
        drawWordmark(ctx, 265, 165, 50);
        drawEyebrow(ctx, state.series, 150, 340, palette.rose, 28);
        ctx.fillStyle = state.accent;
        ctx.font = '700 176px "DM Sans", Arial, sans-serif';
        ctx.fillText(String(state.episode).padStart(2, "0"), 145, 556);
        drawTextBlock(ctx, state.title, 460, 375, 1040, { size: 92, lineHeight: 100, maxLines: 3 });
        ctx.fillStyle = palette.line;
        ctx.fillRect(150, 895, 1620, 2);
        ctx.fillStyle = palette.muted;
        ctx.font = '500 30px "DM Sans", Arial, sans-serif';
        ctx.fillText(state.subtitle, 150, 964);
      }

      function drawOutro() {
        ctx.fillStyle = palette.ivory;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = palette.plum;
        ctx.fillRect(0, 0, canvas.width, 150);
        drawMark(ctx, 807, 220, 306);
        drawWordmark(ctx, 960, 620, 108, false, "center");
        ctx.fillStyle = palette.ink;
        ctx.font = '700 62px "DM Sans", Arial, sans-serif';
        ctx.textAlign = "center";
        ctx.fillText(state.cta, 960, 736);
        ctx.fillStyle = palette.muted;
        ctx.font = '500 34px "DM Sans", Arial, sans-serif';
        ctx.fillText("Aprenda. Organize. Cresca.", 960, 802);
        fillRounded(ctx, 690, 868, 540, 76, 38, state.accent);
        ctx.fillStyle = palette.white;
        ctx.font = '700 30px "DM Sans", Arial, sans-serif';
        ctx.textBaseline = "middle";
        ctx.fillText(state.url, 960, 906);
        ctx.textAlign = "left";
      }

      function drawTip() {
        ctx.fillStyle = palette.plum;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = palette.ivory;
        ctx.fillRect(0, 0, 1180, canvas.height);
        drawMark(ctx, 96, 78, 72);
        drawWordmark(ctx, 190, 132, 44);
        drawEyebrow(ctx, `Dica StudiosBook  |  ${state.episode}`, 96, 280, state.accent, 26);
        const endY = drawTextBlock(ctx, state.title, 96, 330, 920, { size: 88, lineHeight: 96, maxLines: 4 });
        drawTextBlock(ctx, state.subtitle, 96, endY + 32, 900, { size: 34, lineHeight: 45, weight: 500, color: palette.muted, maxLines: 4 });
        drawMark(ctx, 1328, 270, 450, true, 0.95);
        ctx.fillStyle = state.accent;
        ctx.fillRect(1172, 0, 8, canvas.height);
        ctx.save();
        ctx.translate(1675, 865);
        ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = palette.white;
        ctx.font = '700 28px "DM Sans", Arial, sans-serif';
        ctx.fillText(state.url.toUpperCase(), 0, 0);
        ctx.restore();
      }

      function drawReel() {
        ctx.fillStyle = palette.ivory;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = palette.plum;
        ctx.fillRect(0, 0, canvas.width, 425);
        drawMark(ctx, 78, 72, 78, true);
        drawWordmark(ctx, 180, 132, 46, true);
        drawEyebrow(ctx, `${state.series}  |  ${state.episode}`, 80, 500, palette.rose, 24);
        const endY = drawTextBlock(ctx, state.title, 80, 552, 920, { size: 82, lineHeight: 90, maxLines: 5 });
        drawTextBlock(ctx, state.subtitle, 80, endY + 28, 900, { size: 31, lineHeight: 42, weight: 500, color: palette.muted, maxLines: 4 });
        drawScreenshot(ctx, 80, 1055, 920, 620, 28);
        fillRounded(ctx, 80, 1730, 470, 76, 38, state.accent);
        ctx.fillStyle = palette.white;
        ctx.font = '700 27px "DM Sans", Arial, sans-serif';
        ctx.textBaseline = "middle";
        ctx.fillText(state.cta, 116, 1768);
        ctx.fillStyle = palette.muted;
        ctx.font = '600 25px "DM Sans", Arial, sans-serif';
        ctx.fillText(state.url, 80, 1854);
      }

      function drawLowerThird() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const x = 90;
        const y = 760;
        ctx.save();
        ctx.shadowColor = "rgba(23,20,23,.2)";
        ctx.shadowBlur = 36;
        ctx.shadowOffsetY = 14;
        fillRounded(ctx, x, y, 790, 214, 20, palette.plum);
        ctx.restore();
        ctx.fillStyle = state.accent;
        ctx.fillRect(x, y, 12, 214);
        drawMark(ctx, x + 44, y + 47, 120, true);
        ctx.fillStyle = palette.white;
        ctx.font = '700 48px "DM Sans", Arial, sans-serif';
        ctx.fillText(state.person, x + 200, y + 92);
        ctx.fillStyle = "#F3BDC7";
        ctx.font = '500 30px "DM Sans", Arial, sans-serif';
        ctx.fillText(state.role, x + 200, y + 142);
        ctx.fillStyle = palette.white;
        ctx.font = '600 24px "DM Sans", Arial, sans-serif';
        ctx.fillText(state.url, x + 200, y + 178);
      }

      function render() {
        const config = templates[state.template];
        if (canvas.width !== config.width || canvas.height !== config.height) {
          canvas.width = config.width;
          canvas.height = config.height;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (state.template === "thumbnail") drawThumbnail();
        if (state.template === "intro") drawIntro();
        if (state.template === "chapter") drawChapter();
        if (state.template === "outro") drawOutro();
        if (state.template === "tip") drawTip();
        if (state.template === "reel") drawReel();
        if (state.template === "lower") drawLowerThird();
        document.getElementById("preview-title").textContent = config.label;
        document.getElementById("dimensions").textContent = `${config.width} x ${config.height} px`;
      }

      function syncState() {
        ["template", "series", "episode", "title", "subtitle", "cta", "url", "person", "role"].forEach((id) => {
          state[id] = document.getElementById(id).value;
        });
        render();
      }

      function downloadPng() {
        const safeTitle = state.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 42);
        const link = document.createElement("a");
        link.download = `studiosbook-${state.template}-${safeTitle || "arte"}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      }

      function reset() {
        Object.assign(state, defaults, { image: null });
        Object.entries(defaults).forEach(([key, value]) => {
          const element = document.getElementById(key);
          if (element) element.value = value;
        });
        document.getElementById("screenshot").value = "";
        document.querySelectorAll(".swatch").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.color === defaults.accent));
        });
        render();
      }

      document.querySelectorAll("input:not([type=file]), select, textarea").forEach((element) => {
        element.addEventListener("input", syncState);
        element.addEventListener("change", syncState);
      });
      document.querySelectorAll(".swatch").forEach((button) => {
        button.addEventListener("click", () => {
          state.accent = button.dataset.color;
          document.querySelectorAll(".swatch").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
          render();
        });
      });
      document.getElementById("screenshot").addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => { state.image = image; render(); };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      document.getElementById("download").addEventListener("click", downloadPng);
      document.getElementById("reset").addEventListener("click", reset);

      const params = new URLSearchParams(location.search);
      if (templates[params.get("template")]) {
        state.template = params.get("template");
        document.getElementById("template").value = state.template;
      }
      if (params.get("render") === "1") document.body.classList.add("render-mode");

      document.fonts.ready.then(render);
      render();
    </script>
  </body>
</html>
